[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Base Sepolia
[rpc_endpoints]
sepolia = "https://sepolia.base.org"
mainnet = "https://mainnet.base.org"

