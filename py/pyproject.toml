[project]
name = "parlameme"
version = "0.1.0"
description = "Data-driven game engine with typed DSL, NiceGUI interface"
readme = "README.md"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"

[project.urls]
Homepage = "https://parlameme.com/"
Repository = "https://github.com/psychedel/parlameme"
dependencies = [
    "attrs>=25.4.0",
    "cattrs>=25.3.0",
    "msgspec>=0.20.0",
    "nicegui>=3.7.1",
    "pettingzoo>=1.25.0",
    "psycopg[binary]>=3.2",
    "pyrsistent>=0.20.0",
]

[project.scripts]
parlameme = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
training = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
]

[dependency-groups]
dev = [
    "hunter>=3.9.0",
    "hypothesis>=6.151.5",
    "numpy>=1.26",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
